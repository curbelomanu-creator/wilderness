bad)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>bad(new Error('No se pudo cargar '+src));document.body.appendChild(s)})}async function boot(){try{for(const src of ['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://unpkg.com/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js']){try{await load(src);if(window.THREE)break}catch(_){}}if(!window.THREE)throw Error('Three.js no disponible');for(const f of ['world.js','terrain32.js','geography47.js','rivers48.js','engine04.js','nations50.js','chooseNation51.js','compat30.js','army04.js','pregame5101.js','main04.js','camp05.js','trade06.js','bandits06.js','caves06.js','main06.js'])await load(f+'?v=5125a1');setTimeout(()=>startup.style.display='none',350)}catch(e){text.textContent='Error: '+(e.stack||e.message);startup.style.display='flex'}}boot()})();</script></body></html>
