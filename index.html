<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#15100a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Wilderness — Prototype 0.2</title>
  <style>
    :root { --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); }
    * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; width:100%; height:100%; min-height:100dvh; overflow:hidden; background:#15100a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; touch-action:none; overscroll-behavior:none; }
    canvas { display:block; width:100%; height:100%; image-rendering: pixelated; touch-action:none; }
    button { font:inherit; }
    #hud { position:fixed; inset:0; pointer-events:none; color:#f4e6c4; text-shadow:0 2px 2px #000; user-select:none; -webkit-user-select:none; }
    .panel { position:absolute; background:rgba(28,19,11,.76); border:2px solid rgba(235,204,145,.75); box-shadow:0 5px 18px rgba(0,0,0,.35); padding:10px 12px; backdrop-filter: blur(2px); }
    #stats { left:calc(14px + var(--safe-left)); top:calc(14px + var(--safe-top)); min-width:220px; }
    #orders { right:calc(14px + var(--safe-right)); bottom:calc(14px + var(--safe-bottom)); min-width:255px; }
    #message { left:50%; top:calc(18px + var(--safe-top)); transform:translateX(-50%); font-size:18px; padding:8px 14px; opacity:0; transition:opacity .2s; text-align:center; max-width:min(82vw,680px); }
    #crosshair { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:8px; height:8px; border:2px solid rgba(255,245,220,.8); }
    #help { left:calc(14px + var(--safe-left)); bottom:calc(14px + var(--safe-bottom)); max-width:390px; font-size:12px; line-height:1.45; }
    b { color:#fff0b8; }

    #mobile-ui { display:none; position:absolute; inset:0; pointer-events:none; }
    #joystick-zone { position:absolute; left:calc(18px + var(--safe-left)); bottom:calc(22px + var(--safe-bottom)); width:132px; height:132px; pointer-events:auto; touch-action:none; }
    #joystick-base { position:absolute; inset:9px; border-radius:50%; background:rgba(33,25,15,.48); border:2px solid rgba(255,232,180,.52); box-shadow:inset 0 0 24px rgba(0,0,0,.32); }
    #joystick-stick { position:absolute; left:43px; top:43px; width:46px; height:46px; border-radius:50%; background:rgba(245,213,151,.72); border:2px solid rgba(255,246,221,.78); box-shadow:0 4px 14px rgba(0,0,0,.35); transform:translate(0,0); }
    #action-cluster { position:absolute; right:calc(18px + var(--safe-right)); bottom:calc(20px + var(--safe-bottom)); width:174px; height:164px; pointer-events:auto; }
    .touch-btn { position:absolute; display:flex; align-items:center; justify-content:center; border:2px solid rgba(255,232,180,.66); color:#fff4d4; background:rgba(74,46,27,.68); text-shadow:0 2px 2px #000; box-shadow:0 5px 14px rgba(0,0,0,.35); border-radius:50%; font-weight:800; pointer-events:auto; touch-action:none; }
    .touch-btn:active, .touch-btn.active { transform:scale(.94); background:rgba(139,82,45,.88); }
    #btn-attack { width:72px; height:72px; right:0; bottom:38px; font-size:13px; }
    #btn-interact { width:62px; height:62px; right:78px; bottom:82px; font-size:12px; }
    #btn-retreat { width:58px; height:58px; right:86px; bottom:9px; font-size:10px; }
    #btn-run { width:48px; height:48px; right:0; bottom:0; font-size:10px; }
    #mobile-orders { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(13px + var(--safe-bottom)); display:flex; gap:6px; pointer-events:auto; }
    .order-btn { pointer-events:auto; border:1.5px solid rgba(255,232,180,.62); background:rgba(28,19,11,.70); color:#f7e4bb; border-radius:9px; padding:7px 8px; min-width:46px; font-size:10px; font-weight:800; box-shadow:0 3px 10px rgba(0,0,0,.28); touch-action:none; }
    .order-btn.active { background:rgba(162,105,57,.9); color:white; border-color:#fff0b8; }
    #camera-hint { position:absolute; right:calc(18px + var(--safe-right)); top:calc(16px + var(--safe-top)); font-size:10px; opacity:.72; text-align:right; }
    #orientation-hint { display:none; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(18,12,8,.88); border:2px solid rgba(255,232,180,.65); padding:14px 18px; border-radius:12px; width:min(82vw,340px); text-align:center; font-size:12px; line-height:1.45; pointer-events:none; }

    @media (pointer:coarse), (max-width: 820px) {
      #mobile-ui { display:block; }
      #help { display:none; }
      #orders { display:none; }
      #crosshair { width:6px; height:6px; opacity:.72; }
      #stats { min-width:0; width:auto; max-width:62vw; font-size:10px; line-height:1.3; padding:7px 8px; }
      #message { top:calc(9px + var(--safe-top)); font-size:12px; padding:6px 9px; }
      #camera-hint { display:block; }
    }

    @media (pointer:coarse) and (orientation:portrait) and (max-width: 600px) {
      #orientation-hint { display:block; top:34%; }
      #joystick-zone { width:118px; height:118px; }
      #joystick-base { inset:8px; }
      #joystick-stick { left:38px; top:38px; width:42px; height:42px; }
      #action-cluster { transform:scale(.9); transform-origin:bottom right; }
      #mobile-orders { bottom:calc(5px + var(--safe-bottom)); gap:4px; }
      .order-btn { padding:6px; min-width:40px; font-size:9px; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="stats" class="panel"></div>
    <div id="orders" class="panel"></div>
    <div id="message" class="panel"></div>
    <div id="crosshair"></div>
    <div id="help" class="panel">
      <b>WASD</b> mover · <b>Shift</b> correr · <b>E</b> reclutar/montar · <b>F</b> atacar · <b>1</b> personas · <b>2</b> ganado · <b>3</b> todos · <b>4</b> nadie · <b>R</b> retirada · arrastra con botón derecho para girar cámara
    </div>
    <div id="mobile-ui">
      <div id="camera-hint">Arrastra la pantalla<br>para girar cámara</div>
      <div id="orientation-hint">Funciona en vertical, pero para explorar y combatir resulta mejor girar el teléfono a <b>horizontal</b>.</div>
      <div id="joystick-zone" aria-label="Movimiento">
        <div id="joystick-base"></div>
        <div id="joystick-stick"></div>
      </div>
      <div id="action-cluster">
        <button id="btn-attack" class="touch-btn" aria-label="Atacar">ATACAR</button>
        <button id="btn-interact" class="touch-btn" aria-label="Interactuar">ACCIÓN</button>
        <button id="btn-retreat" class="touch-btn" aria-label="Retirada">RETIRADA</button>
        <button id="btn-run" class="touch-btn" aria-label="Correr">CORRER</button>
      </div>
      <div id="mobile-orders" aria-label="Órdenes de seguimiento">
        <button class="order-btn active" data-follow="people">GENTE</button>
        <button class="order-btn" data-follow="livestock">GANADO</button>
        <button class="order-btn" data-follow="all">TODOS</button>
        <button class="order-btn" data-follow="none">NADIE</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
